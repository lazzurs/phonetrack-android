[versions]
agp = "9.4.1"
osmdroid = "6.1.20"

[libraries]
androidx-activity = "androidx.activity:activity:1.13.0"
androidx-appcompat = "androidx.appcompat:appcompat:1.8.0"
androidx-cardview = "androidx.cardview:cardview:1.0.0"
androidx-core = "androidx.core:core:1.19.1"
androidx-preference = "androidx.preference:preference:1.2.1"
androidx-recyclerview = "androidx.recyclerview:recyclerview:1.4.0"
androidx-work-runtime = "androidx.work:work-runtime:2.12.0"
androidx-swiperefreshlayout = "androidx.swiperefreshlayout:swiperefreshlayout:1.2.0"
desugar-jdk-libs = "com.android.tools:desugar_jdk_libs:2.1.5"
material = "com.google.android.material:material:1.14.0"
gson = "com.google.code.gson:gson:2.14.0"
junit = "junit:junit:4.13.2"
androidx-test-core = "androidx.test:core:1.7.0"
androidx-test-ext-junit = "androidx.test.ext:junit:1.3.0"
robolectric = "org.robolectric:robolectric:4.17"
androidx-work-testing = "androidx.work:work-testing:2.12.0"
# NOTE: lowercase groupId (not "bitfireAT" as the GitHub org is styled) -
# JitPack publishes this artifact's Maven path lowercased; the exact-case
# groupId 404s on JitPack's server even though it reports "Build ok".
# Pinned to a commit: newer HEAD rewrites it around Jetpack Compose (unreleased).
cert4android = "com.github.bitfireat:cert4android:7814052"
# cert4android pulls conscrypt-android 2.5.2, whose native libs are 4 KB page
# aligned and fail to load on 16 KB page devices (Android 15+). 2.5.3 is the
# first release built with 16 KB alignment.
conscrypt-android = "org.conscrypt:conscrypt-android:2.5.3"
clans-fab = "com.github.clans:fab:1.6.4"
osmdroid-android = { module = "org.osmdroid:osmdroid-android", version.ref = "osmdroid" }
osmdroid-mapsforge = { module = "org.osmdroid:osmdroid-mapsforge", version.ref = "osmdroid" }
# NOTE: kept at 1.0.6, not the newer 1.1.0 tag - 1.1.0 fails to compile
# here (javac: "class file for com.kizitonwose.colorpreference.ColorDialog
# not found"), apparently a package/module restructuring in that release.
# Repo has been inactive since 2019.
colorpreference = "com.github.kizitonwose.colorpreference:support:1.0.6"
lobsterpicker = "com.larswerkman:lobsterpicker:1.0.1"
nextcloud-sso = "com.github.nextcloud:Android-SingleSignOn:1.3.4"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
