name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# read-only token: this workflow runs the Gradle build, i.e. third-party plugins and dependencies
permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test, assemble
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # all tags: the release check compares the version code with the previous release's
          fetch-depth: 0
          persist-credentials: false

      # a tag like v4 can be moved to other code; a commit SHA can't (Dependabot updates them)
      - name: Check that actions are pinned to commit SHAs
        run: scripts/release/check-workflows.sh

      # release notes and CHANGELOG.md are generated from the commit messages
      - name: Check commit messages (Conventional Commits)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/release/check-commits.sh "origin/$BASE_REF"

      # merging a new version to main publishes a release (release.yml), so only the
      # release workflow and maintainers change it, never a pull request from a fork
      - name: Check the app version is unchanged (pull requests from other repositories)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/release/check-version-unchanged.sh "origin/$BASE_REF"

      - name: Install git-cliff
        run: pipx install git-cliff==2.14.2

      # the version in gradle.properties must be releasable (the same check the release
      # workflow runs on a tag); also previews the next release notes in the job log
      - name: Check release metadata
        run: |
          scripts/release/prepare.sh
          cat release-out/RELEASE_NOTES.md

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # 17 runs Gradle (last listed = JAVA_HOME); 21 is the javac and unit-test
      # toolchain (app/build.gradle.kts), found through JAVA_HOME_21_X64
      - name: Set up JDK 17 and 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: |
            21
            17

      # the Android SDK is the runner image's own (ANDROID_HOME); the Android Gradle plugin
      # downloads the platform and build-tools versions it is missing

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Lint (dev flavor)
        run: ./gradlew -Pci --console=plain :app:lintDevDebug

      # every flavor: some resources (e.g. launcher shortcuts) differ per flavor
      - name: Unit tests (all flavors)
        run: ./gradlew -Pci --console=plain :app:testDevDebugUnitTest :app:testNormalDebugUnitTest :app:testPlayDebugUnitTest

      - name: Assemble debug APK (dev flavor)
        run: ./gradlew -Pci --console=plain assembleDevDebug

      # catches R8 (minify/shrink) configuration problems on every PR, not only at release time
      - name: Assemble minified release APK (normal flavor)
        run: ./gradlew -Pci --console=plain assembleNormalRelease

      # this workflow never gets the signing key, so its APK is debug-signed: tests the check that
      # keeps a debug-signed APK from being published (scripts/release/verify-apk-signer.sh)
      - name: Test the release signer check
        env:
          APK: app/build/outputs/apk/normal/release/app-normal-release.apk
        run: |
          scripts/release/verify-apk-signer.sh other "$APK"
          if scripts/release/verify-apk-signer.sh release "$APK"; then
            echo "::error::a debug-signed APK passed as signed with the release key"
            exit 1
          fi
          echo "a debug-signed APK is refused as a release, as it should be"

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phonetrack-dev-debug
          path: app/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
