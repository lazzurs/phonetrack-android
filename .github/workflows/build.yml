name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test, assemble
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Lint (dev flavor)
        run: ./gradlew -Pci --console=plain :app:lintDevDebug

      # every flavor: some resources (e.g. launcher shortcuts) differ per flavor
      - name: Unit tests (all flavors)
        run: ./gradlew -Pci --console=plain :app:testDevDebugUnitTest :app:testNormalDebugUnitTest :app:testPlayDebugUnitTest

      - name: Assemble debug APK (dev flavor)
        run: ./gradlew -Pci --console=plain assembleDevDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: phonetrack-dev-debug
          path: app/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
