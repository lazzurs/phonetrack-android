name: Back up the signing key (one-off)

# ONE-OFF (#48). Delete this workflow in a follow-up pull request as soon as it has been used.
#
# Moves the release signing key out of GitHub to its owner without it appearing anywhere readable:
# the keystore (RELEASE_KEYSTORE_BASE64) and its password (RELEASE_KEYSTORE_PASSWORD) are each
# piped through age, encrypted to the age recipient given when the run is started (the owner's
# PUBLIC key, never stored here), and the ciphertext is piped over SSH into a write-only inbox.
# Nothing is written to disk in plaintext, echoed, uploaded as an artifact or cached; the log only
# shows the inbox's receipt for each file (name, byte count and SHA-256 of the ciphertext, computed
# by the receiving end).
#
# The inbox's host, port, user, host key and the SSH key that may write to it are secrets of the
# "release" environment (KEYINBOX_HOST, KEYINBOX_PORT, KEYINBOX_USER, KEYINBOX_KNOWN_HOSTS,
# KEYINBOX_SSH_KEY), so none of them is in this public repository. That key can do one thing only:
# store a new *.age file in the inbox (no shell, no reads, no overwrites, no forwarding).
# KEYINBOX_PORT holds a service name (ssh) rather than a number: GitHub blanks out every occurrence
# of a secret's value in the log, and a value such as 22 would blank digits out of the receipts.
#
# Decrypt and check what arrived with scripts/release/verify-signing-key-backup.sh.
on:
  workflow_dispatch:
    inputs:
      age_recipient:
        description: "age recipient (public key, age1...) to encrypt the key to"
        required: true
        type: string

permissions: {}

concurrency:
  group: backup-signing-key
  cancel-in-progress: false

jobs:
  backup:
    name: Send the encrypted signing key to the inbox
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release
    steps:
      - name: Install age
        env:
          AGE_VERSION: v1.3.2
          # sha256 of age-v1.3.2-linux-amd64.tar.gz (matches the digest GitHub records for the asset)
          AGE_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/age.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$tarball" \
            "https://github.com/FiloSottile/age/releases/download/$AGE_VERSION/age-$AGE_VERSION-linux-amd64.tar.gz"
          echo "$AGE_SHA256  $tarball" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/age-bin"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/age-bin" --strip-components=1 age/age
          rm -f "$tarball"
          echo "$RUNNER_TEMP/age-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/age-bin/age" --version

      - name: Encrypt the keystore and its password and send them to the inbox
        env:
          AGE_RECIPIENT: ${{ inputs.age_recipient }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEYINBOX_HOST: ${{ secrets.KEYINBOX_HOST }}
          KEYINBOX_PORT: ${{ secrets.KEYINBOX_PORT }}
          KEYINBOX_USER: ${{ secrets.KEYINBOX_USER }}
          KEYINBOX_KNOWN_HOSTS: ${{ secrets.KEYINBOX_KNOWN_HOSTS }}
          KEYINBOX_SSH_KEY: ${{ secrets.KEYINBOX_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD KEYINBOX_HOST KEYINBOX_PORT \
              KEYINBOX_USER KEYINBOX_KNOWN_HOSTS KEYINBOX_SSH_KEY; do
            [[ -n ${!name} ]] || { echo "::error::secret $name is empty or not set"; exit 1; }
          done
          # an X25519 (age1...) or post-quantum (age1pq1...) recipient, bech32, nothing else
          [[ $AGE_RECIPIENT =~ ^age1(pq1)?[02-9ac-hj-np-z]{58,}$ ]] \
            || { echo "::error::age_recipient is not an age public key (age1...)"; exit 1; }
          echo "encrypting to $AGE_RECIPIENT"

          dir=$(mktemp -d "$RUNNER_TEMP/keyinbox.XXXXXXXX")
          trap 'rm -rf -- "$dir"' EXIT
          install -m 600 /dev/null "$dir/id"
          install -m 600 /dev/null "$dir/known_hosts"
          printf '%s\n' "$KEYINBOX_SSH_KEY" > "$dir/id"
          printf '%s\n' "$KEYINBOX_KNOWN_HOSTS" > "$dir/known_hosts"

          send() {
            ssh -T -F /dev/null -i "$dir/id" -p "$KEYINBOX_PORT" \
              -o IdentitiesOnly=yes -o IdentityAgent=none -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$dir/known_hosts" \
              -o GlobalKnownHostsFile=/dev/null -o ClearAllForwardings=yes \
              -o ConnectTimeout=20 -o ServerAliveInterval=10 -o LogLevel=ERROR \
              "$KEYINBOX_USER@$KEYINBOX_HOST" "cat > inbox/$1"
          }

          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          # pipes only: the plaintext never touches the disk. Each send prints the inbox's receipt.
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d | age -r "$AGE_RECIPIENT" \
            | send "signing-key-$stamp.age"
          printf '%s' "$RELEASE_KEYSTORE_PASSWORD" | age -r "$AGE_RECIPIENT" \
            | send "signing-key-password-$stamp.age"
