name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APKs and publish release
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 secret not set; release APKs will be debug-signed."
          fi

      - name: Run unit tests
        run: ./gradlew -Pci --console=plain :app:testNormalReleaseUnitTest

      - name: Assemble release APKs
        run: ./gradlew -Pci --console=plain assembleNormalRelease assemblePlayRelease

      - name: Collect APKs
        run: |
          mkdir -p release-out
          cp app/build/outputs/apk/normal/release/*.apk release-out/
          cp app/build/outputs/apk/play/release/*.apk release-out/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: release-out/*.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
