apply plugin: 'com.android.application'

// Fork release signing: CI decodes the RELEASE_KEYSTORE_BASE64 secret to a file and passes its
// path here via env vars, so releases are signed consistently across builds. Without those env
// vars (local dev builds), `release` falls back to the debug signing config so it still installs.
def releaseKeystorePath = System.getenv("RELEASE_KEYSTORE_PATH")
def releaseKeystorePassword = System.getenv("RELEASE_KEYSTORE_PASSWORD")
def hasReleaseSigning = releaseKeystorePath && releaseKeystorePassword

android {
    compileSdk 35
    // buildToolsVersion '29.0.3'
    defaultConfig {
        applicationId "net.eneiluj.nextcloud.phonetrack"
        minSdkVersion 26
        targetSdkVersion 35
        versionCode 21
        versionName "0.1.1"
        vectorDrawables.useSupportLibrary true
        resValue "string", "applicationId", applicationId
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias System.getenv("RELEASE_KEY_ALIAS") ?: "phonetrack-fork"
                keyPassword System.getenv("RELEASE_KEY_PASSWORD") ?: releaseKeystorePassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        // AGP 9 defaults this to false; defaultConfig/flavors below use resValue
        resValues true
    }
    productFlavors {
        normal {
            // yes this is repeated
            resValue "string", "app_name", "PhoneTrack"
        }
        dev {
            applicationId 'net.eneiluj.nextcloud.phonetrack.dev'
            resValue "string", "applicationId", applicationId
            resValue "string", "app_name", "PhoneTrack Dev"
        }
        play {
            applicationId "net.eneiluj.nextcloud.phonetrack.play"
            resValue "string", "applicationId", applicationId
            resValue "string", "app_name", "PhoneTrack"
        }
    }
    flavorDimensions "default"
    // solves cert4android crash
    dataBinding {
        enabled = true
    }
    lint {
        abortOnError false
        disable 'MissingTranslation'
    }
    namespace 'net.eneiluj.nextcloud.phonetrack'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    // implementation project(':cert4android')
    // NOTE: lowercase groupId (not "bitfireAT" as the GitHub org is styled) -
    // JitPack publishes this artifact's Maven path lowercased; the exact-case
    // groupId 404s on JitPack's server even though it reports "Build ok".
    implementation 'com.github.bitfireat:cert4android:7814052'

    implementation 'com.github.clans:fab:1.6.4'
    implementation "androidx.appcompat:appcompat:1.8.0"
    // NOTE: capped below latest (1.19.1) - that version's transitive
    // androidx.core:core requires compileSdk 37 (also needed AGP 9.1.0+,
    // since satisfied below). Bumping compileSdk/targetSdk is a bigger
    // platform-target migration (new Android background-execution/
    // permission behavior per API level matters a lot for this app's
    // background location logging) than a routine dependency bump.
    // 1.16.0 is the newest release still compatible with compileSdk 35.
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation "com.google.android.material:material:1.14.0"
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.2.0"
    // needed for cert4android (conflict resolution)
    implementation "androidx.cardview:cardview:1.0.0"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    androidTestImplementation 'junit:junit:4.13.2'
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
    implementation 'org.osmdroid:osmdroid-mapsforge:6.1.20'
    // NOTE: kept at 1.0.6, not the newer 1.1.0 tag - 1.1.0 fails to compile
    // here (javac: "class file for com.kizitonwose.colorpreference.ColorDialog
    // not found"), apparently a package/module restructuring in that release
    // that broke how it composes with lobsterpicker's ColorDialog. Repo has
    // been inactive since 2019; not worth chasing for an unclear benefit.
    implementation 'com.github.kizitonwose.colorpreference:support:1.0.6'
    implementation 'com.larswerkman:lobsterpicker:1.0.1'
    implementation 'com.github.nextcloud:Android-SingleSignOn:1.3.4'
    implementation 'com.google.code.gson:gson:2.14.0'
    // implementation 'com.codebutchery.android:gpx_lib:1.0.2'
}
