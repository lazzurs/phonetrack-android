apply plugin: 'com.android.application'

android {
    compileSdkVersion 29
    buildToolsVersion '29.0.2'

    defaultConfig {
        applicationId "net.eneiluj.nextcloud.phonetrack"
        minSdkVersion 18
        targetSdkVersion 29
        versionCode 18
        versionName "0.0.18"
        multiDexEnabled true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        disable 'MissingTranslation'
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    productFlavors {
        normal {
            // yes this is repeated
            applicationId "net.eneiluj.nextcloud.phonetrack"
            resValue "string", "app_name", "PhoneTrack"
            resValue "string", "applicationId", applicationId
        }
        dev {
            applicationId 'net.eneiluj.nextcloud.phonetrack.dev'
            resValue "string", "app_name", "PhoneTrack Dev"
            resValue "string", "applicationId", applicationId
        }
    }
    flavorDimensions "default"
    // solves cert4android crash
    dataBinding {
        enabled = true
    }
}

dependencies {
    implementation project(':cert4android')
    implementation 'com.github.clans:fab:1.6.4'
    //implementation 'com.jakewharton:butterknife:10.0.0'
    //annotationProcessor 'com.jakewharton:butterknife-compiler:10.0.0'
    def supportLibVersion = '1.1.0'
    //implementation "com.android.support:preference-v7:${supportLibVersion}"
    implementation "androidx.appcompat:appcompat:${supportLibVersion}"
    implementation "com.google.android.material:material:${supportLibVersion}"
    implementation "androidx.recyclerview:recyclerview:${supportLibVersion}"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.0.0"
    // needed for cert4android (conflict resolution)
    implementation "androidx.cardview:cardview:1.0.0"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    androidTestImplementation 'junit:junit:4.12'
    implementation 'org.osmdroid:osmdroid-android:6.1.6'
    implementation 'org.osmdroid:osmdroid-mapsforge:6.1.6'
    implementation 'com.github.kizitonwose.colorpreference:support:1.0.6'
    implementation 'com.larswerkman:lobsterpicker:1.0.1'
    implementation 'com.github.nextcloud:Android-SingleSignOn:0.4.1'
    //implementation 'com.github.nextcloud:Android-SingleSignOn:-SNAPSHOT'
    implementation 'com.google.code.gson:gson:2.8.5'
    implementation 'com.android.support:multidex:1.0.3'
}
