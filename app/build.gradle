apply plugin: 'com.android.application'

android {
    compileSdkVersion 28
    buildToolsVersion '28.0.3'

    defaultConfig {
        applicationId "net.eneiluj.nextcloud.phonetrack"
        minSdkVersion 16
        targetSdkVersion 28
        versionCode 11
        versionName "0.0.11"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        disable 'MissingTranslation'
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    productFlavors {
        normal {
            // yes this is repeated
            applicationId "net.eneiluj.nextcloud.phonetrack"
            resValue "string", "app_name", "PhoneTrack"
            resValue "string", "applicationId", applicationId
        }
        dev {
            applicationId 'net.eneiluj.nextcloud.phonetrack.dev'
            resValue "string", "app_name", "PhoneTrack Dev"
            resValue "string", "applicationId", applicationId
        }
    }
    flavorDimensions "default"
}

dependencies {
    implementation project(':cert4android')
    implementation 'com.github.clans:fab:1.6.4'
    //implementation 'com.jakewharton:butterknife:10.0.0'
    //annotationProcessor 'com.jakewharton:butterknife-compiler:10.0.0'
    def supportLibVersion = '1.0.0'
    //implementation "com.android.support:preference-v7:${supportLibVersion}"
    implementation 'com.takisoft.fix:preference-v7:28.0.0.0'
    implementation 'com.takisoft.fix:preference-v7-extras:28.0.0.0'
    implementation "androidx.appcompat:appcompat:${supportLibVersion}"
    implementation "com.google.android.material:material:${supportLibVersion}"
    implementation "androidx.recyclerview:recyclerview:${supportLibVersion}"
    // needed for cert4android (conflict resolution)
    implementation "androidx.cardview:cardview:${supportLibVersion}"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    androidTestImplementation 'junit:junit:4.12'
    implementation 'org.osmdroid:osmdroid-android:6.0.3'
    implementation 'org.osmdroid:osmdroid-mapsforge:6.0.3'
    implementation 'com.github.kizitonwose.colorpreference:support:1.0.6'
    implementation 'com.larswerkman:lobsterpicker:1.0.1'
    implementation 'com.github.nextcloud:Android-SingleSignOn:0.3.1'
    //implementation 'com.github.nextcloud:Android-SingleSignOn:-SNAPSHOT'
    implementation 'com.google.code.gson:gson:2.8.5'
}
